[project]
name = "riskdesk"
version = "0.2.0"
description = "Portfolio risk, historical tail risk, stress and ORE XVA tools"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "notices/**/*"]
authors = [{name = "Iman Samizadeh"}]
dependencies = ["skfolio==1.1.0", "pydantic>=2.11,<3", "mcp==1.30.0", "numpy>=2", "scipy>=1.15.2",
                "scikit-learn==1.9.1", "optiondesk-engine==0.3.0"]

[project.optional-dependencies]
xva = ["open-source-risk-engine==1.8.16.0"]
dev = ["pytest", "build", "coverage"]

[project.scripts]
riskdesk = "riskdesk.cli:main"
riskdesk-mcp = "riskdesk.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskdesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: in process, no subprocess and no socket",
    "integration: real processes, scripts and transports",
    "validation: repository, documentation and packaging checks",
    "docker: builds and runs the container image, needs a Docker daemon",
]
